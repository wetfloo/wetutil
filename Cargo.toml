[package]
name = "wetutil"
description = "One-stop crate for all the rust features that I'm missing"
version = "0.6.1"
edition = "2021"

license = "MIT"
homepage = "https://github.com/wetfloo/wetutil"
repository = "https://github.com/wetfloo/wetutil"
rust-version = "1.76"

[features]
default = ["std"]

alloc = []
std = ["alloc"]

[workspace.lints.rust]
# keep-sorted start
unreachable_pub = "deny"
unsafe_code = "deny"
# keep-sorted end

[lints.clippy]
# keep-sorted start
alloc_instead_of_core = "warn"
allow_attributes = "warn"
as_pointer_underscore = "deny"
as_ptr_cast_mut = "deny"
assert_is_empty = "deny"
assertions_on_result_states = "warn"
assigning_clones = "warn"
bind_instead_of_map = "deny"
